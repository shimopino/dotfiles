# 生成AI 関連のツール

[tools]
claude = "latest"
# npm 版ではなく GitHub リリースのネイティブバイナリを使用
codex = "latest"
copilot = "latest"
"npm:@mizchi/readability" = "latest"
"npm:ccusage" = "latest"
"npm:agent-browser" = "latest"
"npm:repomix" = "latest"
# "npm:skillgrade" = "latest"

"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@agegr/pi-web" = "latest"

# v2 は GitHub リリースが無いため GitHub backend では解決不可。npm で配布されている
# パッケージ公開が新しいため minimumPackageAge 保護を解除するため allow_low_downloads が必要
"npm:@opencode/cli" = { version = "latest", allow_low_downloads = true }

"github:microsoft/apm" = "latest"
# azd 拡張用の azd-ext-microsoft-azd-waza_* タグを除外し、単体バイナリが付く v* タグだけを対象にする
"github:microsoft/waza" = { version = "latest", rename_exe = "waza", version_prefix = "v" }
"github:rtk-ai/rtk" = "latest"

herdr = "latest"

# curl -fsSL https://browser-use.com/cli/install.sh | bash
